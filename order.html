<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Order - Deprime Healthcare</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background-color: #1a1a1f;
            border: 1px solid #2d2d35;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #9ca3af;
            text-align: center;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #d1d5db;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background-color: #26262f;
            border: 1px solid #3f3f46;
            color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #a855f7;
        }
        .form-row {
            display: flex;
            gap: 16px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .notice {
            font-size: 12px;
            color: #a1a1aa;
            text-align: center;
            margin: 20px 0;
            line-height: 1.5;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #a855f7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #9333ea;
        }
        .success-message {
            display: none;
            text-align: center;
            color: #22c55e;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Deprime Healthcare</h2>
    <div class="subtitle">Please fill out your delivery details below to lock in your order.</div>
    
    <form id="directOrderForm" action="https://formspree.io/f/xbdnknyb" method="POST">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="Full Name" required placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" name="Phone Number" required placeholder="e.g. +254...">
        </div>
        
        <div class="form-group">
            <label for="whatsappNumber">WhatsApp Number</label>
            <input type="tel" id="whatsappNumber" name="WhatsApp Number" required placeholder="Enter WhatsApp number">
        </div>
        
        <div class="form-group">
            <label for="deliveryAddress">Delivery Address</label>
            <input type="text" id="deliveryAddress" name="Delivery Address" required placeholder="Enter your full address/building/estate">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="province">Province / Region</label>
                <input type="text" id="province" name="Province" required placeholder="Province">
            </div>
            <div class="form-group">
                <label for="city">City / Town</label>
                <input type="text" id="city" name="City" required placeholder="City">
            </div>
        </div>
        
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <select id="quantity" name="Quantity">
                <option value="1 Pack: Ksh 3500">1 Pack: Ksh 3500</option>
                <option value="2 Packs (Save 10%): Ksh 5000">2 Packs (Save 10%): Ksh 5000</option>
                <option value="3 Packs (Save 15%): Ksh 7000">3 Packs (Save 15%): Ksh 7000</option>
            </select>
        </div>
        
        <div class="notice">
            🔒 Your information is completely secure. We will review your entry and confirm delivery setup with you shortly.
        </div>
        
        <button type="submit" id="submitBtn">Submit Order Details</button>
        <div id="successMsg" class="success-message">🎉 Order submitted successfully! You can close this window now.</div>
    </form>
</div>

<script>
    const form = document.getElementById('directOrderForm');
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', function(e) {
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting Order...";
        
        // Formspree handles the POST request automatically. 
        // We add a tiny delay to show a beautiful success note before Formspree's standard completion screen takes over.
        setTimeout(() => {
            successMsg.style.display = "block";
        }, 800);
    });
</script>

</body>
</html>
